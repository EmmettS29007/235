<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Web Apps-5</title>
    <style>
        body{
            font-family:sans-serif;
        }
        #colorform{
            background-color:#dfecdf;
            color: #111;
            padding:1em;width:400px;
        }
        #colorform p#info{
            background-color:white;
            color: black;
            width:300px;
            height:100px;
            padding:.5em;
        }
        
        #colorform legend{ 
            font-weight:bold;
            font-size:1.2em;
        }
    </style>
</head>
<body>

<div id="colorform">
    <legend>Choose your favorite color!</legend>
    <p><input onchange="checkButtons()" type="radio" name="colorGroup" id="colorGroupRed" value="red" /> Red</p>
    <p><input onchange="checkButtons()" type="radio" name="colorGroup" id="colorGroupGreen" value="green" /> Green</p>
    <p><input onchange="checkButtons()" type="radio" name="colorGroup" id="colorGroupBlue" value="blue" /> Blue</p>
    <p><button onclick="finalAnswer()" id="colorButton" type="button">Submit</button></p>
    <p id="info"></p>
</div>


<script>
    var radioList = document.querySelectorAll("input")
    var color;

    function checkButtons(){
        radioList.forEach(element => {
        if(element.checked){
            color = element.value;
            document.getElementById("info").innerHTML = "You have selected " + color;
            document.querySelector("legend").style.color = color;
        }
    });
    }

    function finalAnswer(){
        document.getElementById("info").innerHTML = "Your FINAL CHOICE is " + color;
    }
    
    
</script>
</body>
</html>

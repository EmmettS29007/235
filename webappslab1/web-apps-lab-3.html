<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Web Apps-4-HW</title>
	<style>
		body{border:1px solid gray;}
	</style>
</head>
<body>
<h1>My Favorites</h1>
<h2>My Favorite Colors</h2>

<ol id="colorsList">
	
</ol>

<h2>My Favorite Foods</h2>

<ol id="foodsList">
	
</ol>

<h2>My Favorite Links</h2>

<ol id="linksList">
	
</ol>

<script>
"use strict";
let colors = ["orange","orange 1","orange 3","orange 67","orange 2"];
let foods = ["fondue","pizza","egg and rice","paneer tikka masala"]; // add some foods

// Optional - can you figure out how to pull both the key AND the value
// from the `links` object literal?
let links = {
		"RIT": "http://www.rit.edu",
		"RWAG" : "https://www.facebook.com/RWAGclub",
		"New Media Club" : "http://newmediaclub.cias.rit.edu"
	}

    const colorsContainer = document.getElementById("colorsList")

    for (let i = 0; i < colors.length; i++) {
        const newListItem = document.createElement('li');
        newListItem.textContent = colors[i];
        colorsContainer.appendChild(newListItem);
    }
    
    const foodsContainer = document.getElementById("foodsList")

    for (const element of foods) {
        const newListItem = document.createElement('li');
        newListItem.textContent = element;
        foodsContainer.appendChild(newListItem);
    }

</script>
</body>
</html>

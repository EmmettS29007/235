<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"ESIER-Portfolio"</title>
    <link rel="stylesheet" href="betterStyle.css">
    
</head>
<body>
    <header>
        <h1 id = "topMessage">
            Emmett Sier <em>The Quiz</em>
        </h1>
    </header>
    
    <main>
        <div class="infobox" id="infobox1">
            <p> What State Is Emmett From? </p><br>
            <div class="option">
                <p><em>A.</em> Nebraska </p>
                <p><em>B.</em> Wisconsin </p>
            </div>
        </div>

        <div class="infobox" id="infobox2">
            <p> Emmett Likes To Give Out: </p>
            <div class="option">
                <p><em>A.</em> Worms on Strings </p>
                <p><em>B.</em> Squinkies </p>
            </div>
        </div>

        <div class="infobox" id="infobox3">
            <p> What is Emmett's Favorite Color?</p>
            <div class="option" id="longOption">
                <p><em>A.</em> Sky Blue </p>
                <p><em>B.</em> Neon Orange </p>
            </div>
        </div>

        <div class="textbox" id="textbox1">
            <p>  <a href="https://www.youtube.com/watch?v=fpdP2rbrz9Q"> These are wise words to live by! </a></p>
        </div>

        <div class="textbox" id="textbox2">
            <p> Can you get 3/3 ? </p>
        </div>

        <img id="emmettFace" src="myFace.png" alt="Emmett Siers Smirking Face">

        <img id="emmettFace2" src="image-removebg-preview.png" alt="Emmett Siers Cold Face">

        <img id="cat" src="meowmeow-removebg-preview.png" alt="A purrfect black and white kitty cat">
    </main>

    <footer>
        <p>_ </p>
    </footer>
</body>
</html>
